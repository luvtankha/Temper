spring:
  application:
    name: temper
temper:
  store:
    enabled: ${TEMPER_STORE_ENABLED:false}
    play-key: ${TEMPER_PLAY_LICENSE_KEY:}
    signing-key: ${TEMPER_STORE_SIGNING_KEY:}
    credentials: ${TEMPER_PLAY_CREDENTIALS:}
  overlay:
    token: ${TEMPER_OVERLAY_TOKEN:}
  conflict:
    weights: ${TEMPER_CONFLICT_WEIGHTS:negativeSentiment=0.25,anger=0.20,toxicity=0.20,sarcasm=0.15,blame=0.10,defensiveness=0.10}
    smoothing: ${TEMPER_CONFLICT_SMOOTHING:0.6,0.3,0.1}
    trend-threshold: ${TEMPER_CONFLICT_TREND_THRESHOLD:0.08}
  indicators:
    enabled: ${TEMPER_INDICATORS_ENABLED:true}
  toxicity:
    model-dir: ${TEMPER_TOXICITY_MODEL_DIR:}
  sarcasm:
    model-dir: ${TEMPER_SARCASM_MODEL_DIR:}
  emotion:
    model-dir: ${TEMPER_EMOTION_MODEL_DIR:}
  sentiment:
    model-dir: ${TEMPER_SENTIMENT_MODEL_DIR:}
  foundation:
    model-dir: ${TEMPER_FOUNDATION_MODEL_DIR:}
  context:
    previous-turns: ${TEMPER_CONTEXT_PREVIOUS_TURNS:5}
  websocket:
    allowed-origins: ${TEMPER_WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  demo:
    enabled: ${TEMPER_DEMO_ENABLED:true}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
