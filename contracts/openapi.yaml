openapi: 3.0.3
info:
  title: TEMPER API
  version: 0.1.0
  description: Health and Phase 10 domain reads. Backend analysis remains unavailable.
servers:
  - url: /api/v1
paths:
  /conversations:
    get:
      operationId: listConversations
      responses:
        '200':
          description: Available in-memory conversations, seeded with fictional data when demo mode is enabled.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Conversation'}
  /conversations/{id}:
    get:
      operationId: getConversation
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Conversation metadata and participant identity; no inferred analysis is fabricated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '400': {description: Invalid UUID}
        '404': {description: Conversation does not exist}
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Backend is running; this does not imply inference is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Participant:
      type: object
      required: [id, name, variant]
      properties:
        id: {type: string, description: Opaque user identity; initial fictional aliases are alex and nova.}
        name: {type: string}
        variant: {type: string, enum: [male, female]}
    Conversation:
      type: object
      required: [id, title, createdAt, participants, messageCount, analysisStatus]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        createdAt: {type: string, format: date-time}
        participants:
          type: array
          items: {$ref: '#/components/schemas/Participant'}
        messageCount: {type: integer, minimum: 0}
        analysisStatus: {type: string, enum: [NONE, MOCK, MODEL, HYBRID]}
    Health:
      type: object
      required: [status, application, analysisMode]
      properties:
        status: {type: string, enum: [UP]}
        application: {type: string, enum: [TEMPER]}
        analysisMode: {type: string, enum: [NONE]}
