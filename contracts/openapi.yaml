openapi: 3.0.3
info:
  title: TEMPER API
  version: 0.11.0
  description: Versioned REST. Additive conflictAnalysis contains rawScore, smoothedScore, UP/FLAT/DOWN trend, ranked source-aware topContributors, fixtureInputs and priorSequences; existing conflict remains the legacy field. Optional local sentiment, emotion, independent sarcasm and toxicity models replace their fields with inspectable HYBRID provenance. Emotion includes documented proxies; configured toxicity adds insult/threat and explicit max(insult,threat) hostility proxy to the bounded signals map. Six documented lexical/context indicators have separate HEURISTIC evidence and optional disagreement/withdrawal/repeatedDisagreement scores. Unconfigured model channels and conflict/markers are fixtures. Model-free mode MOCK; delivery independent of analysis.
servers:
  - url: /api/v1
paths:
  /ai/foundation/classify:
    post:
      operationId: classifyFoundationText
      description: Optional isolated English SST-2 classifier, unrelated to current conversation MOCK output. Truncates to128 tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 12000}
      responses:
        '200':
          description: Genuine local inference
          content:
            application/json:
              schema:
                type: object
                required: [modelId, source, probabilities, tokenCount, inferenceMillis]
                properties:
                  modelId: {type: string}
                  source: {type: string, enum: [MODEL]}
                  probabilities:
                    type: object
                    required: [negative, positive]
                    properties:
                      negative: {type: number, minimum: 0, maximum: 1}
                      positive: {type: number, minimum: 0, maximum: 1}
                  tokenCount: {type: integer, minimum: 1, maximum: 128}
                  inferenceMillis: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/Invalid'}
        '503': {description: Local foundation model is not configured}
  /conversations:
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversation'}
      responses:
        '201':
          description: Created in-memory conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '400': {$ref: '#/components/responses/Invalid'}
    get:
      operationId: listConversations
      responses:
        '200':
          description: Available in-memory conversations, seeded with fictional data when demo mode is enabled.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Conversation'}
  /conversations/{id}:
    get:
      operationId: getConversation
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Conversation metadata and participant identity; no inferred analysis is fabricated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '400': {description: Invalid UUID}
        '404': {description: Conversation does not exist}
  /conversations/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: listMessages
      responses:
        '200':
          description: Ordered by sequence, ascending
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Message'}}
        '404': {$ref: '#/components/responses/Missing'}
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [speakerId, text]
              properties:
                speakerId: {type: string, minLength: 1, maxLength: 80}
                text: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201':
          description: Delivered and saved; no inference runs in the delivery request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/Invalid'}
        '404': {$ref: '#/components/responses/Missing'}
  /messages/{id}/analyze:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      operationId: analyzeMessage
      responses:
        '200':
          description: Explicit MOCK fixture, not text inference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageAnalysis'}
        '404': {$ref: '#/components/responses/Missing'}
  /messages/{id}/context:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getMessageContext
      responses:
        '200':
          description: Current message and up to five preceding turns with speaker identity; no future turns
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContextWindow'}
        '404': {$ref: '#/components/responses/Missing'}
  /messages/{id}/analysis:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getMessageAnalysis
      responses:
        '200':
          description: Stored analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageAnalysis'}
        '409':
          description: Analysis not requested; never returns fabricated zero scores
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/Missing'}
  /conversations/{id}/analytics:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getConversationAnalytics
      responses:
        '200':
          description: Only analyzed turns; metrics null until a turn is analyzed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analytics'}
        '404': {$ref: '#/components/responses/Missing'}
  /conversations/{id}/timeline:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getConversationTimeline
      responses:
        '200':
          description: Turn series and explicit fixture markers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Timeline'}
        '404': {$ref: '#/components/responses/Missing'}
  /conversations/{id}/insights:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getConversationInsights
      responses:
        '200':
          description: Structured fixture provenance and markers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Insights'}
        '404': {$ref: '#/components/responses/Missing'}
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Backend is running; this does not imply inference is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Invalid:
      description: Invalid request, validation or participant membership
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Missing:
      description: Unknown conversation or message
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    ContextTurn:
      type: object
      required: [messageId, speaker, text, sequence, sentAt]
      properties:
        messageId: {type: string, format: uuid}
        speaker:
          type: object
          required: [id, displayName, avatarVariant]
          properties:
            id: {type: string}
            displayName: {type: string}
            avatarVariant: {type: string, enum: [MALE, FEMALE]}
        text: {type: string}
        sequence: {type: integer, minimum: 1}
        sentAt: {type: string, format: date-time}
    ContextWindow:
      type: object
      required: [conversationId, current, previous]
      properties:
        conversationId: {type: string, format: uuid}
        current: {$ref: '#/components/schemas/ContextTurn'}
        previous: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/ContextTurn'}}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, enum: [INVALID_REQUEST, NOT_FOUND, ANALYSIS_UNAVAILABLE]}
        message: {type: string}
    CreateConversation:
      type: object
      required: [title, participantIds]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        participantIds: {type: array, minItems: 2, maxItems: 20, uniqueItems: true, items: {type: string}}
    Message:
      type: object
      required: [id, conversationId, speakerId, text, sentAt, sequence]
      properties:
        id: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        speakerId: {type: string}
        text: {type: string, minLength: 1, maxLength: 2000}
        sentAt: {type: string, format: date-time}
        sequence: {type: integer, minimum: 1}
    Scores:
      type: object
      additionalProperties: {type: number, minimum: 0, maximum: 1}
    MessageAnalysis:
      type: object
      required: [messageId, speakerId, sequence, sentAt, mode, emotions, signals, sentiment, conflict, contextMessageIds, explanation, evidence]
      properties:
        messageId: {type: string, format: uuid}
        speakerId: {type: string}
        sequence: {type: integer, minimum: 1}
        sentAt: {type: string, format: date-time}
        mode: {type: string, enum: [MOCK, MODEL, HYBRID]}
        emotions: {$ref: '#/components/schemas/Scores'}
        signals: {$ref: '#/components/schemas/Scores'}
        sentiment: {type: number, minimum: -1, maximum: 1}
        conflict: {type: number, minimum: 0, maximum: 1}
        trajectory: {$ref: '#/components/schemas/Trajectory'}
        conflictAnalysis: {$ref: '#/components/schemas/ConflictAnalysis'}
        contextMessageIds: {type: array, items: {type: string, format: uuid}}
        explanation: {type: string}
        evidence:
          type: array
          items:
            type: object
            required: [source, label, description]
            properties:
              source: {type: string, enum: [MOCK, MODEL, HEURISTIC]}
              label: {type: string}
              description: {type: string}
    Trajectory:
      type: object
      required: [state, evidenceStrength, explanation, contributingSignals, sequences]
      properties:
        state: {type: string, enum: [STABLE, TENSION_RISING, ESCALATION_RISK, DEESCALATING, WITHDRAWAL_RISK, REPAIR_OPPORTUNITY, UNCERTAIN]}
        evidenceStrength: {type: number, minimum: 0, maximum: 1, description: "Uncalibrated engineering rule strength, not a probability"}
        explanation: {type: string}
        contributingSignals: {$ref: '#/components/schemas/Scores'}
        sequences: {type: array, items: {type: integer, minimum: 1}}
    ConflictAnalysis:
      type: object
      required: [rawScore, smoothedScore, trend, topContributors, fixtureInputs, priorSequences]
      properties:
        rawScore: {type: number, minimum: 0, maximum: 1}
        smoothedScore: {type: number, minimum: 0, maximum: 1}
        trend: {type: string, enum: [UP, FLAT, DOWN]}
        fixtureInputs: {type: boolean}
        priorSequences: {type: array, items: {type: integer, minimum: 1}}
        topContributors:
          type: array
          items:
            type: object
            required: [signal, value, weight, contribution, source]
            properties:
              signal: {type: string}
              value: {type: number, minimum: 0, maximum: 1}
              weight: {type: number, minimum: 0, maximum: 1}
              contribution: {type: number, minimum: 0, maximum: 1}
              source: {type: string, enum: [MOCK, MODEL, HEURISTIC]}
    Event:
      type: object
      required: [sequence, messageId, kind, label]
      properties:
        sequence: {type: integer, minimum: 1}
        messageId: {type: string, format: uuid}
        kind: {type: string, enum: [escalation, peak, recovery]}
        label: {type: string}
    Timeline:
      type: object
      required: [conversationId, mode, messages, events, pendingMessages]
      properties:
        conversationId: {type: string, format: uuid}
        mode: {type: string, enum: [MOCK, MODEL, HYBRID]}
        messages: {type: array, items: {$ref: '#/components/schemas/MessageAnalysis'}}
        events: {type: array, items: {$ref: '#/components/schemas/Event'}}
        pendingMessages: {type: integer, minimum: 0}
    Analytics:
      allOf:
        - {$ref: '#/components/schemas/Timeline'}
        - type: object
          required: [conflictScore, sentiment, emotionalIntensity, direction, escalationStart, peakTension]
          properties:
            conflictScore: {type: number, minimum: 0, maximum: 1, nullable: true}
            sentiment: {type: number, minimum: -1, maximum: 1, nullable: true}
            emotionalIntensity: {type: number, minimum: 0, maximum: 1, nullable: true}
            direction: {type: string, enum: [steady, escalating, recovering]}
            escalationStart: {type: integer, minimum: 1, nullable: true}
            peakTension: {type: integer, minimum: 1, nullable: true}
    Insights:
      type: object
      required: [conversationId, mode, events, pendingMessages, explanation]
      properties:
        conversationId: {type: string, format: uuid}
        mode: {type: string, enum: [MOCK, MODEL, HYBRID]}
        events: {type: array, items: {$ref: '#/components/schemas/Event'}}
        pendingMessages: {type: integer, minimum: 0}
        explanation: {type: string}
    Participant:
      type: object
      required: [id, name, variant]
      properties:
        id: {type: string, description: Opaque user identity; initial fictional aliases are alex and nova.}
        name: {type: string}
        variant: {type: string, enum: [male, female]}
    Conversation:
      type: object
      required: [id, title, createdAt, participants, messageCount, analysisStatus]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        createdAt: {type: string, format: date-time}
        participants:
          type: array
          items: {$ref: '#/components/schemas/Participant'}
        messageCount: {type: integer, minimum: 0}
        analysisStatus: {type: string, enum: [NONE, MOCK, MODEL, HYBRID]}
    Health:
      type: object
      required: [status, application, analysisMode]
      properties:
        status: {type: string, enum: [UP]}
        application: {type: string, enum: [TEMPER]}
        analysisMode: {type: string, enum: [NONE, HYBRID]}
